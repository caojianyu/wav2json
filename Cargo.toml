[package]
name = "wav2json"
version = "0.2.0"
edition = "2021"
authors = ["Jianyu Cao <jienicao26@gmail.com>"]
license = "MIT"
description = "A library that decodes wav audio files into json waveform data"
readme = "README.md"
homepage = "https://github.com/caojianyu/wav2json"
repository = "https://github.com/caojianyu/wav2json"
keywords = ["audio", "waveform"]
categories = ["algorithms"]

exclude = [
    "examples/data.json",
    "examples/example.png",
    "examples/index.html",
    "examples/sample-15s.wav",
]

[dependencies]
reqwest = { version = "0.12.5", features = ["blocking"] }

[dev-dependencies]
serde_json = "1.0"
